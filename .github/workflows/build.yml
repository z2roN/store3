# ==============================================================================
#  z2roN_Store 자동 빌드 설명  (이 파일: .github/workflows/build.yml)
# ==============================================================================
#  소스를 GitHub 저장소에 올리고 Actions > "z2roN_Store 빌드" > Run workflow 를 누르면
#  GitHub 서버가 아래 3가지를 대신 만들어 줍니다. (5~15분 후 실행 맨 아래 Artifacts)
#    - z2roN_Store-server-v버전   : 서버 프로그램 (매장 서버 PC에서 실행, MDB를 관리)
#    - z2roN_Store-windows-v버전  : 윈도우 매장 PC용 프로그램 (z2roN_Store.exe)
#    - z2roN_Store-android-v버전  : 안드로이드 설치 파일 (app-release.apk)
#  [실패했을 때] 실패한 단계의 마지막 로그(Android는 "오류 요약")를 복사해서 알려주세요.
#  [업데이트할 때] pubspec.yaml 의 version 과 lib/main.dart 의 kAppVersion,
#                 server/Program.cs 의 Version 을 함께 올립니다.
# ==============================================================================
name: z2roN_Store 빌드

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  APP_NAME: z2roN_Store
  PKG_NAME: z2ron_store
  APP_TITLE: z2roN-Store

jobs:
  server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: "서버 빌드 (32비트 - Windows 내장 Jet 엔진 사용, 별도 설치 불필요)"
        run: dotnet publish server/StoreServer.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -o out/server
      - name: 서버 실행 안내 파일 추가
        shell: bash
        run: |
          printf '%s\r\n' "z2roN_Store 서버 사용법" "1) 이 폴더 전체를 서버 PC 의 원하는 위치(예: C:\z2roN_Store)에 복사" "2) z2roN_StoreServer.exe 를 실행 (처음 실행 시 data 폴더에 store.mdb 가 자동 생성됨)" "3) Windows 방화벽 안내가 나오면 '허용' (개인 네트워크)" "4) 다른 PC/모바일 앱 설정의 서버 주소에 서버PC주소:5080 입력 (예 192.168.0.10:5080)" "5) 처음 로그인: admin / 1234 (바로 변경하세요)" "설정 파일: server.json (포트, MDB 경로, 백업 폴더/보관 개수)" > out/server/사용법.txt
      - name: 버전 읽기
        id: ver
        shell: bash
        run: echo "v=$(grep '^version:' pubspec.yaml | sed -E 's/version:[ ]*//; s/\+.*//')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: z2roN_Store-server-v${{ steps.ver.outputs.v }}
          path: out/server
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: 플랫폼 폴더 생성
        run: |
          flutter create --platforms=android,windows --project-name "$PKG_NAME" --org com.z2ron .
          rm -f test/widget_test.dart
      - name: 권한 추가 (인터넷, 카메라 바코드 스캔) + 내부망 HTTP 허용
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <application android:usesCleartextTraffic="true"#' "$M"
          grep -q "usesCleartextTraffic" "$M" || { echo "권한 설정 실패"; exit 1; }
          cat "$M" | head -20
      - name: 앱 이름 설정
        run: sed -i "s/android:label=\"[^\"]*\"/android:label=\"$APP_TITLE\"/" android/app/src/main/AndroidManifest.xml
      - name: 최소 SDK 23 (보안 저장소 요구사항)
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E 's/minSdk(Version)?[ =]+flutter\.minSdkVersion/minSdk = 23/' "$f"
            grep -n "minSdk" "$f" || true
          done
      - name: 플러그인 compileSdk 36 맞춤 (file_picker 등이 compileSdk 34로 빌드되어 생기는 AAR 메타데이터 오류 방지)
        run: |
          if [ -f android/build.gradle.kts ]; then
            cat >> android/build.gradle.kts <<'KTS'


            // ---- z2roN_story: 플러그인 모듈의 compileSdk 를 36 으로 맞춤 ----
            // (flutter_plugin_android_lifecycle 이 compileSdk 36 이상을 요구하는데,
            //  file_picker 등 일부 플러그인은 34 로 빌드되어 checkReleaseAarMetadata 가 실패함)
            subprojects {
                val fixCompileSdk: () -> Unit = {
                    val ext = extensions.findByName("android")
                    if (ext != null && name != "app") {
                        val intType = Int::class.javaPrimitiveType
                        val boxedType = Int::class.javaObjectType
                        val setters = ext.javaClass.methods.filter { m ->
                            m.parameterCount == 1 &&
                                (m.name == "setCompileSdk" || m.name == "setCompileSdkVersion" || m.name == "compileSdkVersion") &&
                                (m.parameterTypes[0] == intType || m.parameterTypes[0] == boxedType)
                        }
                        var applied = 0
                        for (m in setters) {
                            try {
                                m.isAccessible = true
                                m.invoke(ext, 36)
                                applied++
                            } catch (e: Exception) {
                                logger.lifecycle("[z2roN_Store] " + name + ": " + m.name + " 호출 실패: " + e.message)
                            }
                        }
                        val getter = ext.javaClass.methods.firstOrNull { g -> g.name == "getCompileSdk" && g.parameterCount == 0 }
                        val now = try { getter?.invoke(ext) } catch (e: Exception) { null }
                        val ok = (now is Int) && now >= 36
                        logger.lifecycle(
                            "[z2roN_Store] " + name + ": compileSdk 호출 " + applied + "회, 현재 값 = " + now +
                                (if (ok) " (OK)" else " (적용 확인 안 됨 -> 이 모듈의 AAR 검사만 건너뜀)")
                        )
                        if (!ok) {
                            // 비상용: 검사 작업을 그냥 끄면 뒤 단계(bundleReleaseLocalLintAar)가 출력 폴더가 없다며 실패하므로,
                            // 건너뛰기 직전에 출력 폴더를 미리 만들어 둠
                            tasks.configureEach {
                                if (name.startsWith("check") && name.endsWith("AarMetadata")) {
                                    val t = this
                                    val variant = name.removePrefix("check").removeSuffix("AarMetadata")
                                        .replaceFirstChar { c -> c.lowercase() }
                                    onlyIf {
                                        t.outputs.files.files.forEach { f -> f.mkdirs() }
                                        t.project.layout.buildDirectory.get().asFile
                                            .resolve("intermediates/aar_metadata_check/" + variant + "/" + t.name)
                                            .mkdirs()
                                        false
                                    }
                                }
                            }
                        }
                    }
                }
                if (state.executed) fixCompileSdk() else afterEvaluate { fixCompileSdk() }
            }
          KTS
          elif [ -f android/build.gradle ]; then
            cat >> android/build.gradle <<'GRV'

            subprojects {
                def fixSdk = { p ->
                    if (p.name != 'app' && p.hasProperty('android')) {
                        p.android.compileSdkVersion 36
                    }
                }
                if (state.executed) { fixSdk(it) } else { afterEvaluate { fixSdk(it) } }
            }
          GRV
          else
            echo "android/build.gradle(.kts) 를 찾을 수 없습니다"; exit 1
          fi
          echo "----- android/build.gradle(.kts) 끝부분 -----"
          tail -n 45 android/build.gradle.kts 2>/dev/null || tail -n 20 android/build.gradle
      - name: Gradle 호환 설정 (오래된 플러그인과 최신 Kotlin 사이의 JVM 대상 불일치 오류 방지)
        run: |
          printf '\nkotlin.jvm.target.validation.mode=warning\n' >> android/gradle.properties
          tail -n 5 android/gradle.properties
      - name: 영수증 한글 폰트 내려받기
        shell: bash
        run: |
          mkdir -p assets/fonts
          curl -fsSL -o assets/fonts/NanumGothic-Regular.ttf https://github.com/google/fonts/raw/main/ofl/nanumgothic/NanumGothic-Regular.ttf
          curl -fsSL -o assets/fonts/NanumGothic-Bold.ttf https://github.com/google/fonts/raw/main/ofl/nanumgothic/NanumGothic-Bold.ttf
          ls -l assets/fonts
      - name: 환경 정보 출력 (오류 분석용)
        run: flutter doctor -v
      - run: flutter pub get
      - name: APK 빌드
        run: |
          set -o pipefail
          flutter build apk --release --no-shrink -v 2>&1 | tee build.log
      - name: APK 검사 (설치 오류 분석용 - 크기, 서명, 매니페스트 확인)
        if: always()
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -l "$APK" || exit 0
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "== 서명 검사 =="; "$BT/apksigner" verify --verbose "$APK" 2>&1 | head -10 || true
          echo "== 앱 정보 =="; "$BT/aapt2" dump badging "$APK" 2>&1 | grep -E "^package|sdkVersion|targetSdk|uses-permission|ERROR" | head -20 || true
          echo "== 합쳐진 매니페스트 application 부분 =="; "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" 2>&1 | grep -nE "application|usesCleartext|E: uses-permission" | head -15 || true
      - name: 오류 요약 (빌드가 실패했을 때만 실행 - 이 단계의 출력을 복사해서 알려주세요)
        if: failure()
        run: |
          PAT='z2roN_Store|FAILURE:|An issue was found|Recommended action|What went wrong|Execution failed|error:|^e: |Could not |Unresolved|Namespace|requires|Inconsistent|Duplicate|Manifest merger'
          echo "===== Dart 코드 오류 (lib/...dart) ====="
          grep -nE "lib/.*\.dart:[0-9]+:[0-9]+|Error:" build.log | cut -c1-300 | head -40 || true
          echo "===== 오류 요약 ====="
          grep -nE "$PAT" build.log | cut -c1-300 | head -60 || true
          echo "===== 로그 마지막 60줄 ====="
          tail -n 60 build.log
          {
            echo '### Android 빌드 오류 요약'
            echo '```'
            echo '--- Dart 코드 오류 ---'
            grep -nE "lib/.*\.dart:[0-9]+:[0-9]+|Error:" build.log | cut -c1-300 | head -30 || true
            grep -nE "$PAT" build.log | cut -c1-300 | head -40 || true
            echo '--- 마지막 40줄 ---'
            tail -n 40 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 전체 빌드 로그 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z2roN_Store-android-build-log
          path: build.log
          if-no-files-found: ignore
      - name: 버전 읽기
        id: ver
        shell: bash
        run: echo "v=$(grep '^version:' pubspec.yaml | sed -E 's/version:[ ]*//; s/\+.*//')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: z2roN_Store-android-v${{ steps.ver.outputs.v }}
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: 플랫폼 폴더 생성
        shell: bash
        run: |
          flutter create --platforms=android,windows --project-name "$PKG_NAME" --org com.z2ron .
          rm -f test/widget_test.dart
      - name: 실행 파일/창 이름 설정
        shell: bash
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed -E 's/version:[ ]*//; s/\+.*//')
          sed -i "s/set(BINARY_NAME \"[^\"]*\")/set(BINARY_NAME \"$APP_NAME\")/" windows/CMakeLists.txt
          sed -i "s/L\"$PKG_NAME\"/L\"$APP_TITLE v$VER\"/" windows/runner/main.cpp
          sed -i "s/$PKG_NAME/$APP_NAME/g" windows/runner/Runner.rc
          grep -n "BINARY_NAME" windows/CMakeLists.txt | head -3
      - name: 영수증 한글 폰트 내려받기
        shell: bash
        run: |
          mkdir -p assets/fonts
          curl -fsSL -o assets/fonts/NanumGothic-Regular.ttf https://github.com/google/fonts/raw/main/ofl/nanumgothic/NanumGothic-Regular.ttf
          curl -fsSL -o assets/fonts/NanumGothic-Bold.ttf https://github.com/google/fonts/raw/main/ofl/nanumgothic/NanumGothic-Bold.ttf
          ls -l assets/fonts
      - run: flutter pub get
      - run: flutter build windows --release
      - name: 버전 읽기
        id: ver
        shell: bash
        run: echo "v=$(grep '^version:' pubspec.yaml | sed -E 's/version:[ ]*//; s/\+.*//')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: z2roN_Store-windows-v${{ steps.ver.outputs.v }}
          path: build/windows/x64/runner/Release
